# External timer (ADR-0002, ticket 36; timer app — ADR-0003, ticket 42). Deployed by the installer; see README.md.
name = "auto-reset-timer"
main = "index.mjs"
compatibility_date = "2026-09-20"
# Scheduled handler only: no workers.dev URL and no preview URLs.
workers_dev = false
preview_urls = false

[triggers]
# Planner grid: phase :02, cadence 5 minutes (src/schedule/schedule-time.mjs).
crons = ["2-57/5 * * * *"]

[vars]
# owner/repo of the private installation and the timer app IDs (ticket 42), set at deploy
# with --var. Empty fails closed. The key is the TIMER_APP_KEY secret, never a var.
REPOSITORY = ""
TIMER_APP_ID = ""
TIMER_INSTALLATION_ID = ""

[observability]
enabled = true
