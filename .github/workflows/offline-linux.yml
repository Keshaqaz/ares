name: Offline Linux validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Install pinned synthetic test dependencies
        run: |
          bash scripts/install-linux-prerequisites.sh
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/install-app-server.mjs
      - name: Offline integration and template checks
        run: npm test
      - name: Stock App Server with loopback-only network
        run: bash scripts/test-contract-linux.sh
